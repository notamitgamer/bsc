name: Build and Deploy BSc Code Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'apk-manifest/manifest.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Safe Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          rm -rf /tmp/hf_sync_payload
          mkdir -p /tmp/hf_sync_payload/bsc
          rsync -av --delete \
            --exclude='.git' \
            --exclude='MinGW64' \
            --exclude='*.exe' \
            --exclude='site_files' \
            "$GITHUB_WORKSPACE/" /tmp/hf_sync_payload/bsc/

          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          import os
          from huggingface_hub import upload_folder

          upload_folder(
              repo_id="notamitgamer/cdn",
              repo_type="dataset",
              folder_path="/tmp/hf_sync_payload/bsc",
              path_in_repo="bsc",
              delete_patterns="*",
              commit_message="Safe auto-sync: updating bsc code index files",
              token=os.environ["HF_TOKEN"],
          )
          PY
          
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate markdown files
        run: |
          python list.py
          python main.py

      - name: Generate changelog
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ACTOR: ${{ github.actor }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          git log -10 --pretty=format:"COMMIT|%H|%s|%an|%aI" --numstat > git_log_numstat.txt
          git log -10 --pretty=format:"COMMIT|%H" --name-status > git_log_namestatus.txt
          python changelog.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache VitePress
        uses: actions/cache@v6
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json', 'docs/.vitepress/config.*') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Build VitePress
        run: npm run docs:build
        env:
          VITE_DEPLOY_ID: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Commit generated changelog to repo
        run: |
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update changelog [skip ci]"
            git push
          else
            echo "No changelog changes"
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
