name: Build and Deploy BSc Code Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: Independent cloud synchronization
  sync-hf:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1 

      - name: Safe Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://notamitgamer:${HF_TOKEN}@huggingface.co/datasets/notamitgamer/usercontent /tmp/hf_repo
          rsync -av --delete \
            --exclude='.git' \
            --exclude='MinGW64' \
            --exclude='*.exe' \
            --exclude='site_files' \
            $GITHUB_WORKSPACE/ /tmp/hf_repo/
          cd /tmp/hf_repo
          git lfs install
          git lfs track "*.pdf"
          git lfs track "*.docx"
          git lfs track "*.odt"
          git add .gitattributes
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@://github.com"
          git add .
          git commit -m "Safe auto-sync: updating GitHub files while protecting dynamic folders" || echo "No changes to commit"
          git push origin main

  # Job 2: Main processing engine (Generates data -> Builds -> Saves -> Commits)
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20  
          token: ${{ steps.app-token.outputs.token }}

      # Step 1: Generate your custom markdown and log indexes
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate markdown files
        run: |
           python list.py
           python main.py
      
      - name: Generate changelog
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ACTOR: ${{ github.actor }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          git log -10 --pretty=format:"COMMIT|%H|%s|%an|%aI" --numstat > git_log_numstat.txt
          git log -10 --pretty=format:"COMMIT|%H" --name-status > git_log_namestatus.txt
          python changelog.py

      # Step 2: Set up environment and declare stable hashing rules
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache VitePress
        uses: actions/cache@v4
        with:
          path: .vitepress/cache
          # Forced key layout updates ensure hashes stay matched across separate runs
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json', 'docs/.vitepress/config.*') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      # Step 3: Run your localized site build task 
      - name: Build VitePress
        run: npm run docs:build
        env:
          VITE_DEPLOY_ID: ${{ github.sha }}

      # Step 4: Package files directly from the true build directory location
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      # Step 5: Save your files back to the branch only when deployment wraps up completely
      - name: Commit generated changelog to repo
        run: |
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@://github.com"
          
          git add CHANGELOG.md
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: update changelog [skip ci]"
            git push
          else
            echo "No changes"
          fi

  # Job 3: Standard automated fallback backup
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.actor != 'bot-for-notamitgamer[bot]'
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout Latest Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  
          token: ${{ steps.app-token.outputs.token }}
          ref: main 

      - name: Get IST Date and Time
        id: datetime
        run: |
          echo "TIMESTAMP=$(TZ='Asia/Kolkata' date +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_ENV
          echo "PRETTY_DATE=$(TZ='Asia/Kolkata' date +'%d %B %Y, %I:%M %p IST')" >> $GITHUB_ENV

      - name: Create Git Bundle Backup
        run: git bundle create "full-repo-backup-${{ env.TIMESTAMP }}.bundle" --all

      - name: Update Rolling Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release delete latest-backup -y --cleanup-tag || true
          gh release create "latest-backup" "full-repo-backup-${{ env.TIMESTAMP }}.bundle" \
            --title "Latest Bundle Backup - ${{ env.PRETTY_DATE }}" \
            --notes "Automated full repository bundle generated on ${{ env.PRETTY_DATE }}. Restore offline using \`git clone full-repo-backup-${{ env.TIMESTAMP }}.bundle\`."

  # Job 4: Clean deployment production pipeline
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
