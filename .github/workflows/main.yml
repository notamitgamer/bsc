name: Build and Deploy BSc Code Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'apk-manifest/manifest.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Safe Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git clone https://notamitgamer:${HF_TOKEN}@huggingface.co/datasets/notamitgamer/usercontent /tmp/hf_repo

          rsync -av --delete \
            --exclude='.git' \
            --exclude='MinGW64' \
            --exclude='*.exe' \
            --exclude='site_files' \
            "$GITHUB_WORKSPACE/" /tmp/hf_repo/

          cd /tmp/hf_repo

          git lfs install
          git lfs track "*.pdf"
          git lfs track "*.docx"
          git lfs track "*.odt"

          git add .gitattributes

          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git add .

          git commit \
            -m "Safe auto-sync: updating GitHub files while protecting dynamic folders" \
            || echo "No changes to commit"

          git push origin main
          
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate markdown files
        run: |
          python list.py
          python main.py

      - name: Generate changelog
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ACTOR: ${{ github.actor }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          git log -10 --pretty=format:"COMMIT|%H|%s|%an|%aI" --numstat > git_log_numstat.txt
          git log -10 --pretty=format:"COMMIT|%H" --name-status > git_log_namestatus.txt
          python changelog.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache VitePress
        uses: actions/cache@v6
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json', 'docs/.vitepress/config.*') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Build VitePress
        run: npm run docs:build
        env:
          VITE_DEPLOY_ID: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Upload dist for APK content job
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: docs/.vitepress/dist
          retention-days: 1

      - name: Commit generated changelog
        run: |
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update changelog [skip ci]"
            git push
          else
            echo "No changelog changes"
          fi

  apk-content:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    needs: build

    permissions:
      contents: write

    steps:

      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Package content bundle
        id: bundle
        run: |
          cd dist

          zip -qr ../bundle.zip .

          cd ..

          CHECKSUM=$(sha256sum bundle.zip | cut -d' ' -f1)

          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

          echo "Bundle checksum: $CHECKSUM"
          echo "Bundle version: ${{ github.run_number }}"

      - name: Publish content bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-content
          name: APK content bundle (latest)
          body: |
            Latest site content bundle for the offline APK's auto-updater.

            This is not a standalone release.
            It provides the bundle used by:

            apk-manifest/manifest.json
          files: bundle.zip
          prerelease: true
          overwrite_files: true

      - name: Create APK manifest
        run: |
          mkdir -p apk-manifest

          cat > apk-manifest/manifest.json <<EOF
          {
            "version": "${{ steps.bundle.outputs.version }}",
            "url": "https://github.com/${{ github.repository }}/releases/download/apk-content/bundle.zip",
            "checksum": "${{ steps.bundle.outputs.checksum }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          echo "Generated manifest:"
          cat apk-manifest/manifest.json

      - name: Commit and push APK manifest
        run: |
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git add apk-manifest/manifest.json

          if git diff --cached --quiet; then
            echo "No manifest changes"
            exit 0
          fi

          git commit -m "chore: update APK content manifest [skip ci]"

          for attempt in 1 2 3 4 5; do
            echo ""
            echo "=========================================="
            echo "Manifest push attempt $attempt/5"
            echo "=========================================="

            # Get the newest remote main.
            git fetch origin main

            # Rebase our manifest commit on the newest main.
            if ! git rebase origin/main; then
              echo "Rebase failed."
              git rebase --abort
              exit 1
            fi

            # Try pushing the rebased commit.
            if git push origin HEAD:main; then
              echo ""
              echo "Manifest pushed successfully."
              exit 0
            fi

            echo "Push rejected because main changed again."
            echo "Waiting before retry..."

            sleep 3
          done

          echo ""
          echo "ERROR: Failed to push manifest after 5 attempts."
          exit 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    if: github.actor != 'bot-for-notamitgamer[bot]'

    needs: build

    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
