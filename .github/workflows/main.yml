name: Build and Deploy BSc Code Index

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'apk-manifest/manifest.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-hf:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Safe Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          HF_CLONE_URL="https://notamitgamer:${HF_TOKEN}@huggingface.co/datasets/notamitgamer/cdn"

          # Partial clones (--filter=blob:none) against Hugging Face's git
          # backend occasionally fail mid-fetch with errors like
          # "fatal: expected 'packfile'" / "could not fetch ... from
          # promisor remote" — a protocol hiccup on their end, not ours.
          # Retry the partial clone a couple of times first (cheap: it
          # doesn't download file contents), then fall back to a plain
          # full clone (no --filter) which doesn't use the promisor-remote
          # fetch path at all, so it isn't affected by the same failure.
          clone_ok=false
          for attempt in 1 2 3; do
            echo "Partial clone attempt ${attempt}/3..."
            rm -rf /tmp/hf_repo
            if git clone --filter=blob:none --no-checkout --depth 1 "$HF_CLONE_URL" /tmp/hf_repo; then
              clone_ok=true
              break
            fi
            echo "Partial clone attempt ${attempt} failed."
            sleep 5
          done

          if [ "$clone_ok" = false ]; then
            echo "Partial clone failed after 3 attempts — falling back to a full clone."
            rm -rf /tmp/hf_repo
            git clone --no-checkout --depth 1 "$HF_CLONE_URL" /tmp/hf_repo
          fi

          cd /tmp/hf_repo
          
          git sparse-checkout set bsc
          
          git checkout main
          
          mkdir -p bsc

          rsync -av --delete \
            --exclude='.git' \
            --exclude='MinGW64' \
            --exclude='*.exe' \
            --exclude='site_files' \
            "$GITHUB_WORKSPACE/" bsc/

          git lfs install
          git lfs track "bsc/**/*.pdf"
          git lfs track "bsc/**/*.docx"
          git lfs track "bsc/**/*.odt"

          git add .gitattributes
          
          git add bsc/

          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git commit \
            -m "Safe auto-sync: updating bsc code index files" \
            || echo "No changes to commit"

          git push origin main
          
  build:
    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 20
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Generate markdown files
        run: |
          python list.py
          python main.py

      - name: Generate changelog
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_ACTOR: ${{ github.actor }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}
        run: |
          git log -10 --pretty=format:"COMMIT|%H|%s|%an|%aI" --numstat > git_log_numstat.txt
          git log -10 --pretty=format:"COMMIT|%H" --name-status > git_log_namestatus.txt
          python changelog.py

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache VitePress
        uses: actions/cache@v6
        with:
          path: .vitepress/cache
          key: ${{ runner.os }}-vitepress-${{ hashFiles('package-lock.json', 'docs/.vitepress/config.*') }}
          restore-keys: |
            ${{ runner.os }}-vitepress-

      - name: Build VitePress
        run: npm run docs:build
        env:
          VITE_DEPLOY_ID: ${{ github.sha }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

      - name: Commit generated changelog to repo
        run: |
          git config user.name "bot-for-notamitgamer[bot]"
          git config user.email "bot-for-notamitgamer[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if ! git diff --cached --quiet; then
            git commit -m "chore: update changelog [skip ci]"
            git push
          else
            echo "No changelog changes"
          fi

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    if: github.actor != 'bot-for-notamitgamer[bot]'
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
